name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Restore fixed release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rabbit-sleep-guard-release.jks"
          chmod 600 "$RUNNER_TEMP/rabbit-sleep-guard-release.jks"
      - name: Test usage timeline accounting
        run: |
          mkdir -p /tmp/usage-tests
          javac -d /tmp/usage-tests android/app/src/main/java/com/rabbit/sleepguard/UsageTimeline.java android/tests/UsageTimelineTest.java
          java -cp /tmp/usage-tests UsageTimelineTest
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rabbit-sleep-guard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease
      - name: Give APK a versioned filename
        id: package
        shell: bash
        run: |
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version"
          test -n "$version_code"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/rabbit-sleep-guard-v${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Verify package, version, and fixed signature
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/rabbit-sleep-guard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apk="dist/rabbit-sleep-guard-v${{ steps.package.outputs.version }}.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          "$build_tools/apksigner" verify --verbose "$apk"
          badging="$("$build_tools/aapt" dump badging "$apk" | head -n 1)"
          grep -F "package: name='com.rabbit.sleepguard'" <<< "$badging"
          grep -F "versionCode='${{ steps.package.outputs.version_code }}'" <<< "$badging"
          grep -F "versionName='${{ steps.package.outputs.version }}'" <<< "$badging"
          cert_info="$("$build_tools/apksigner" verify --print-certs "$apk" 2>&1)"
          actual_digest="$(printf '%s\n' "$cert_info" | awk -F': ' 'tolower($0) ~ /certificate sha-256 digest/ {print $NF; exit}' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected_digest="$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | openssl dgst -sha256 -binary | xxd -p -c 256 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_digest"
          printf 'APK certificate SHA-256: %s\n' "$actual_digest"
          test "$actual_digest" = "$expected_digest"
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: rabbit-sleep-guard-v${{ steps.package.outputs.version }}
          path: dist/rabbit-sleep-guard-v${{ steps.package.outputs.version }}.apk
          if-no-files-found: error
